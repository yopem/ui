name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          base: ${{ github.ref }}
          filters: |
            docs:
              - 'apps/docs/**'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Install package managers for CLI tests
        run: npm install --global npm@10.9.3 pnpm@10.18.3 yarn@1.22.22
      - run: bun install --frozen-lockfile
      - run: bun run generate-routes
      - run: bun run --cwd packages/registry docs:generate
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run typecheck
      - run: bun run test
      - run: bunx playwright install --with-deps chromium
        if: steps.changes.outputs.docs == 'true'
        working-directory: apps/docs
      - run: bun run test:e2e && bun run test:a11y
        if: steps.changes.outputs.docs == 'true'
