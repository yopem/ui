name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          base: ${{ github.ref }}
          filters: |
            docs:
              - 'apps/docs/**'
              - 'packages/registry/**'
              - 'packages/editor/**'
              - 'tests/e2e/**'
              - 'tests/editor-callout-clipboard/**'
              - 'playwright.config.ts'
              - 'tests/tsconfig.json'
              - 'package.json'
              - 'bun.lock'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - name: Install package managers for CLI tests
        run: npm install --global npm@12.2.1 pnpm@12.15.0 yarn@1.22.22
      - run: bun install --frozen-lockfile
      - run: bun run generate-routes
      - run: bun run --cwd packages/registry docs:generate
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run typecheck
      - run: bun run test
      - run: bunx playwright install --with-deps chromium
        if: steps.changes.outputs.docs == 'true'
      - run: bun run test:editor-callout-clipboard
        if: steps.changes.outputs.docs == 'true'
      - uses: actions/upload-artifact@v7
        if: always() && steps.changes.outputs.docs == 'true'
        with:
          name: editor-callout-clipboard
          path: test-results/editor-callout-clipboard
      - run: bun run test:e2e && bun run test:a11y
        if: steps.changes.outputs.docs == 'true'
